name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licences and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # There is no gradle-wrapper.jar in the repository (it is a binary that the toolchain here
      # cannot produce), so the action installs the same Gradle version the wrapper properties pin.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Design-system, resource and binding gates
        run: |
          python3 tools/check_ui_tokens.py
          python3 tools/check_resources.py
          python3 tools/check_view_bindings.py

      - name: Kotlin syntax gate
        run: |
          pip install --quiet tree-sitter tree-sitter-kotlin
          python3 tools/check_kotlin_syntax.py

      # continue-on-error so the failure is annotated (readable from the API and inline on a PR)
      # instead of only existing inside a log blob. `set -o pipefail` keeps tee from hiding the code.
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log

      - name: Annotate test and compile failures
        if: steps.unit_tests.outcome == 'failure'
        run: |
          python3 tools/annotate_build_errors.py gradle-test.log
          python3 tools/report_test_failures.py || true

      - name: Fail the job when tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Annotate compile failures
        if: steps.assemble.outcome == 'failure'
        run: python3 tools/annotate_build_errors.py gradle-build.log

      - name: Fail the job when the build failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1

      # The Python gates read files. Lint reads the compiled app: API-level violations, accessibility,
      # unused resources, manifest and resource-linkage problems. It had never been run on this
      # codebase before this step existed. It sits after the debug build so compilation is up to date
      # and the step pays only for analysis.
      - name: Android Lint (static analysis)
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:lintDebug --no-daemon --stacktrace 2>&1 | tee gradle-lint.log

      # Always runs: the report is written even when lint fails the task, and it is the only copy of
      # the findings that this environment can read.
      - name: Annotate lint findings
        if: always()
        run: python3 tools/annotate_lint.py app/build/reports/lint-results-debug.xml

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montra-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job when lint found errors
        if: steps.lint.outcome == 'failure'
        run: exit 1

      # Shrinking is only safe while it is exercised. This builds the release variant unsigned - R8
      # and resource shrinking both run - so a keep rule that stops working is a red build instead of
      # a crash in a published APK. It also proves the release manifest and resources link.
      # The bundle is what Play takes, and it goes through the same R8 output as the APK, so building
      # both costs packaging and proves the format that will actually be uploaded.
      - name: Assemble release APK and bundle (R8, unsigned)
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle-release.log

      - name: Annotate release failures
        if: steps.release.outcome == 'failure'
        run: python3 tools/annotate_build_errors.py gradle-release.log

      - name: Fail the job when the release build failed
        if: steps.release.outcome == 'failure'
        run: exit 1

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: montra-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: montra-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: montra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
